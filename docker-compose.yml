services:
  postgres:
    image: postgres:18-alpine
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_sterilization
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
    ports:
      - "5432:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_sterilization"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  clinic_postgres_data: